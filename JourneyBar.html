<style>/* ds/wba/styles.css */
/* WBA Design System webfonts. Roboto is the brand face across the whole system — product UI
   and display/spec headers alike. (The source .fig used Bodoni 72 on its own spec
   boards; that has been retired in favour of Roboto.) */
@import url("https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@500&family=Raleway:wght@500;700&family=Montserrat:wght@500;700&family=Noto+Sans:wght@700&display=swap");
:root{
  --font-core:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-display:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-marketing:"Raleway",var(--font-core);
  --font-marketing-alt:"Montserrat",var(--font-core);
}

/* Colour tokens transcribed verbatim from the .fig
   — 2020 Revamp "Color" board (2455:1845) and the 2019 "Color Palatte" board (47:0). */
:root{
  /* RH brand */
  --rh-brand-graphite:#5A585A;
  --rh-brand-ink:#25282A;

  /* Primary 2 — green (2020 revamp product primary) */
  --green-900:#064E34;
  --green-700:#086F4A;
  --green-500:#0DA16C;
  --green-200:#B6E3D3;
  --green-050:#E7F9F2;

  /* Brand blue — WBA #003DA5 (2019 phase-1 primary) */
  --blue-900:#002563;
  --blue-800:#003DA5;
  --blue-700:#1950AE;
  --blue-400:#668BC9;
  --blue-200:#B2C5E4;
  --blue-050:#E5ECF6;

  /* Primary 1 — action blue */
  --actionblue-900:#003899;
  --actionblue-700:#005EFF;
  --actionblue-500:#196EFF;
  --actionblue-400:#669EFF;
  --actionblue-200:#B2CFFF;
  --actionblue-050:#E5EFFF;

  /* Secondary — lime */
  --lime-700:#8DAA00;
  --lime-600:#8CA900;
  --lime-500:#B0D400;
  --lime-400:#B8D819;
  --lime-300:#D0E566;
  --lime-200:#E7F2B2;
  --lime-100:#F3F9D9;
  --lime-050:#F7FBE5;

  /* Neutral — text black ramp */
  --black:#000000;
  --grey-900:#202020;
  --grey-800:#404040;
  --grey-700:#777777;
  --grey-600:#808080;
  --grey-500:#979797;
  --grey-400:#AAAAAA;
  --grey-300:#BFBFBF;
  --grey-250:#CCCCCC;
  --grey-230:#D2D2D2;
  --grey-220:#D9D9D9;
  --grey-210:#DADADA;
  --grey-200:#E6E6E6;
  --grey-150:#EEEEEE;
  --grey-100:#F2F2F2;
  --white:#FFFFFF;

  /* Neutral — text blue / slate ramp */
  --slate-900:#232B3A;
  --slate-800:#263238;
  --slate-700:#3A4861;
  --slate-600:#4E5A71;
  --slate-500:#4F4F4F;
  --slate-400:#8991A0;
  --slate-300:#C4C8D0;
  --slate-200:#EBEDEF;

  /* System colours */
  --red-500:#D42600;
  --red-050:#F9DFD9;
  --amber-600:#F9B300;
  --yellow-500:#FFD12E;
  --yellow-050:#FFF8E0;
  --green-system:#1BB135;
  --purple-500:#6936F8;
  --purple-050:#F3EFFB;

  /* Surfaces */
  --bg-app:#F4F6FA;
  --surface:#FFFFFF;

  /* ── Semantic aliases ── */
  --primary:var(--green-500);
  --primary-hover:var(--green-700);
  --primary-pressed:var(--green-900);
  --primary-tint:var(--green-050);
  --primary-1:var(--actionblue-500);
  --primary-1-hover:var(--actionblue-900);
  --primary-2:var(--brand);
  --primary-2-hover:var(--brand-hover);
  --secondary:var(--lime-500);
  --secondary-hover:var(--lime-600);

  --text-primary:var(--black);
  --text-body:var(--grey-900);
  --text-secondary:var(--grey-700);
  --text-muted:var(--grey-600);
  --text-placeholder:var(--grey-300);
  --text-disabled:var(--grey-250);
  --text-inverse:var(--white);
  --text-link:var(--actionblue-500);
  --text-error:var(--red-500);
  --text-field-label:var(--slate-900);

  --border:var(--grey-300);
  --border-strong:var(--grey-400);
  --border-field:var(--slate-300);
  --border-table:var(--grey-300);
  --divider:var(--grey-150);

  --state-disabled-bg:var(--grey-200);
  --state-error:var(--red-500);
  --state-warning:var(--yellow-500);
  --state-success:var(--green-system);
  --state-info:var(--actionblue-500);

  --toast-bg:var(--slate-700);
  --tooltip-bg:var(--slate-800);

  --link:var(--actionblue-500);
  --link-hover:var(--actionblue-900);
}

/* ── Brand themes ──
   Two brands share one system. WBA is blue (#003DA5) and is the DEFAULT —
   every component accent resolves to it. RH is green: set data-brand="rh"
   on <html> or any subtree to swap the whole accent set back to the 2020 green. */
:root,[data-brand="wba"]{
  --brand:var(--blue-800);
  --brand-hover:var(--blue-900);
  --brand-pressed:var(--blue-900);
  --brand-tint:var(--blue-050);
  --brand-soft:var(--blue-200);
  --brand-on:var(--white);
}
[data-brand="rh"]{
  --brand:var(--green-500);
  --brand-hover:var(--green-700);
  --brand-pressed:var(--green-900);
  --brand-tint:var(--green-050);
  --brand-soft:var(--green-200);
  --brand-on:var(--white);
}
/* Component accents follow the active brand. */
:root,[data-brand]{
  --accent:var(--brand);
  --accent-hover:var(--brand-hover);
  --accent-pressed:var(--brand-pressed);
  --accent-tint:var(--brand-tint);
  --accent-soft:var(--brand-soft);
  --primary:var(--brand);
  --primary-hover:var(--brand-hover);
  --primary-pressed:var(--brand-pressed);
  --primary-tint:var(--brand-tint);
}

/* Type ramp from the 2019 Style Guide "Typography" board (2:82).
   Roboto only; every product style is set at line-height 100% with the
   figure-space letter-spacing the components use (0.03em). */
:root{
  --text-display-size:36px;   --text-display-weight:700;  --text-display-lh:1;
  --text-headline-size:24px;  --text-headline-weight:500; --text-headline-lh:1;
  --text-title-size:20px;     --text-title-weight:700;    --text-title-lh:1;
  --text-subtitle-size:16px;  --text-subtitle-weight:700; --text-subtitle-lh:1;
  --text-body-size:14px;      --text-body-weight:500;     --text-body-lh:1;
  --text-body-sm-size:12px;   --text-body-sm-weight:500;  --text-body-sm-lh:1;
  --text-para-size:12px;      --text-para-weight:400;     --text-para-lh:1;
  --text-caption-size:12px;   --text-caption-weight:400;  --text-caption-lh:16px;
  --text-micro-size:10px;     --text-micro-weight:400;    --text-micro-lh:1;
  --text-nano-size:8px;       --text-nano-weight:400;     --text-nano-lh:1;

  /* document / spec faces (Roboto display) used on design-system boards */
  --text-doc-hero-size:90px;
  --text-doc-title-size:40px;
  --text-doc-sub-size:20px;

  --tracking-ui:0.03em;    /* the letter-spacing on nearly every UI label */
  --tracking-field:0.4px;  /* text-field captions & helper text */
  --tracking-toast:0.002em;
}

/* Spacing, radius and sizing observed across the component sheets.
   The product grid is a 10-column layout on a 1440 / 1920 artboard with a
   120px outer margin on design-system boards and 30px gutters in product screens. */
:root{
  --space-1:4px;  --space-2:5px;  --space-3:6px;  --space-4:8px;
  --space-5:10px; --space-6:12px; --space-7:14px; --space-8:16px;
  --space-9:20px; --space-10:24px; --space-11:30px; --space-12:40px;
  --space-13:50px; --space-14:60px; --space-15:120px;

  --radius-xs:2px;   /* search bar, round box */
  --radius-sm:3px;   /* image placeholders */
  --radius-md:4px;   /* buttons, chips, text fields, toasts */
  --radius-lg:8px;
  --radius-pill:1000px;

  --control-h-s:20px;   /* chip S */
  --control-h-m:24px;   /* chip M / icon 24 */
  --control-h-field:40px;
  --control-h-btn:36px;
  --control-h-btn-s:28px;
  --row-h-header:40px;
  --row-h-body:60px;
  --menu-item-h:44px;
  --appbar-h:90px;
  --stepper-h:76px;
  --progress-h:7px;

  --icon-sm:12px; --icon-md:20px; --icon-lg:24px; --icon-xl:48px;

  --grid-columns:10; /* @kind other */
  --grid-page:1440px;
  --grid-page-wide:1920px;
  --grid-margin:120px;
  --grid-gutter:30px;
}

/* Shadows transcribed from the component sheets. */
:root{
  --shadow-btn:0px 1px 4px 0px rgba(0,0,0,0.12);
  --shadow-btn-hover:0px 4px 6px 0px rgba(0,0,0,0.2);
  --shadow-control:0px 4px 8px 0px rgba(48,79,254,0.24);
  --shadow-card:0px 2px 4px 0px rgba(0,0,0,0.12);
  --shadow-menu:0px 2px 4px 1px rgba(165,178,200,0.1),0px 3px 8px 1px rgba(165,178,200,0.3);
  --shadow-toast:0px 2px 4px 1px rgba(165,178,200,0.1),0px 3px 8px 1px rgba(165,178,200,0.3);
  --shadow-swatch:0px 10px 10px 0px rgba(0,0,0,0.25);
  --shadow-dialog:0px 10px 20px 0px rgba(0,0,0,0.25);

  --border-hairline:0.5px;   /* table grid lines */
  --border-thin:1px;         /* field outlines */
  --border-thick:2px;        /* active tab underline */

  --motion-fast:120ms; /* @kind other */
  --motion-base:200ms; /* @kind other */
  --motion-ease:cubic-bezier(0.4,0.0,0.2,1); /* @kind other */
}

:root{color-scheme:light}
body{font-family:var(--font-core);color:var(--text-body);background:var(--bg-app)}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover);text-decoration:underline}


</style>
